name: qr_code_generator
description: "A Flutter app that generates, saves, and shares QR codes from text or URLs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # QR code generation
  qr_flutter: ^4.1.0

  # Save QR image to device gallery
  gal: ^2.3.0

  # Convert widget to image bytes for saving/sharing
  screenshot: ^3.0.0

  # Share QR image and text
  share_plus: ^10.1.3

  # Local storage for QR history
  shared_preferences: ^2.2.2

  # Runtime permissions (Android photo/storage access)
  permission_handler: ^11.3.0

  # Temp directory access for share
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true